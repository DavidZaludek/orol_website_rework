<!doctype html>
<html lang="sk">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Scroll-reveal arming. The CSS only hides [data-reveal] content while
			// this attribute is present, so content is never hidden by a stylesheet
			// that no script can undo. If the app bundle is blocked or fails to
			// boot, the timer drops the attribute and everything becomes visible.
			document.documentElement.setAttribute('data-reveal-ready', '');
			window.__orolRevealFallback = setTimeout(function () {
				document.documentElement.removeAttribute('data-reveal-ready');
			}, 2500);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
